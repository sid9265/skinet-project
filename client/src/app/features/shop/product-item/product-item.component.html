@if (product) {
  <mat-card appearance="raised">
    <img src="{{ product.pictureUrl }}" alt="{{ product.name }}" class="card-img-top" />
    <mat-card-content class="mt-2">
      <h5 class="text-sm font-semibold uppercase">{{ product.name }}</h5>
      <p class="font-light">{{ product.price | currency }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-stroked-button class="w-full">
        <mat-icon>add_shopping_cart</mat-icon>
        Add to Cart
      </button>
    </mat-card-actions>
  </mat-card>
}
